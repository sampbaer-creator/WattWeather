<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Compare local weather with statewide electricity data, then privately explore whether weather helps explain your own daily energy use.">
    <meta name="theme-color" content="#0b0b0b">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://archive-api.open-meteo.com; font-src 'self'; form-action 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests">
    <title>WattWeather</title>
    <base href="/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="app">
        <div class="boot">
            <span>W</span>
            <p>Loading WattWeather</p>
            <i></i>
        </div>
    </div>
    <div id="blazor-error-ui">
        WattWeather hit an unexpected error.
        <a href="" class="reload">Reload</a>
        <button class="dismiss" type="button">Dismiss</button>
    </div>
    <script src="js/wattweather.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
