name: Bug report
description: Report a reproducible problem in WattWeather
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve WattWeather. Never include API keys or personal utility information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Search for...
        3. Select...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser or app version and operating system
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys and personal utility information.
          required: true

