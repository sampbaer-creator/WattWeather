name: Update public EIA energy data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 2 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public EIA statistics
        env:
          EIA_API_KEY: ${{ secrets.energy658 }}
        run: node scripts/fetch-eia-data.mjs
      - name: Publish updated data
        shell: bash
        run: |
          if git diff --quiet -- data/eia-state-energy.json; then
            echo "EIA data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eia-state-energy.json
          git commit -m "Update public EIA energy statistics"
          git push
