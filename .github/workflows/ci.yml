name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/WeatherEnergyAnalytics.Web/WeatherEnergyAnalytics.Web.csproj
      - run: dotnet build src/WeatherEnergyAnalytics.Web/WeatherEnergyAnalytics.Web.csproj --no-restore --configuration Release
      - run: dotnet test tests/WeatherEnergyAnalytics.Core.Tests/WeatherEnergyAnalytics.Core.Tests.csproj --configuration Release
      - run: dotnet test tests/WeatherEnergyAnalytics.Infrastructure.Tests/WeatherEnergyAnalytics.Infrastructure.Tests.csproj --configuration Release
